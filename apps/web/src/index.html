<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Salonzoft — Salon & Spa ERP</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Salonzoft — bilingual salon & spa management for Oman: bookings, POS & VAT, staff, inventory and more.">
  <meta name="theme-color" content="#6b2d5c" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141016" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="application-name" content="Salonzoft">
  <meta name="apple-mobile-web-app-title" content="Salonzoft">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Apply saved theme/language before first paint to avoid a flash.
    try {
      var t = localStorage.getItem('sz.theme');
      if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      var l = localStorage.getItem('sz.lang');
      if (l === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
    } catch (e) {}
  </script>
</head>
<body>
  <sz-root></sz-root>
  <noscript>Salonzoft needs JavaScript. · يحتاج سالونزوفت إلى تفعيل JavaScript.</noscript>
</body>
</html>
