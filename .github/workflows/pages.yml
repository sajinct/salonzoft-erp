name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npx ng test --watch=false

      - name: Inject Supabase connection (repository variables, if set)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            sed -i "s|https://YOUR-PROJECT-REF.supabase.co|$SUPABASE_URL|; s|REPLACE_WITH_PUBLISHABLE_KEY|$SUPABASE_PUBLISHABLE_KEY|" src/environments/environment.pages.ts
            echo "Supabase connection configured."
          else
            echo "::warning::SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY repository variables are not set — the deployed UI will load but cannot sign in."
          fi

      - run: npx ng build --configuration github-pages

      - name: SPA fallback + disable Jekyll
        run: |
          cp dist/web/browser/index.html dist/web/browser/404.html
          touch dist/web/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist/web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
